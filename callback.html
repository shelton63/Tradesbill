  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A2540;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 30px;
    }
    .icon-loading { background: #EEF3F8; animation: pulse 1.2s ease-in-out infinite; }
    .icon-success { background: #E1F5EE; }
    .icon-error { background: #FCEBEB; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    h2 { font-size: 20px; font-weight: 600; color: #061A30; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B6A65; line-height: 1.6; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #B5D4F4;
      border-top-color: #0A2540;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;

</head>
<body>
  <div class="card" id="card">
    <div class="icon icon-loading" id="icon">
      <div class="spinner"></div>
    </div>
    <h2 id="title">Confirming your account...</h2>
    <p id="msg">Please wait a moment while we verify your email.</p>
  </div>

  <script>
    async function handleCallback() {
      try {
        if (SUPABASE_URL === 'YOUR_PROJECT_URL_HERE' || SUPABASE_KEY === 'YOUR_ANON_KEY_HERE') {
          throw new Error('Supabase keys not set in callback.html. Open the file on GitHub and paste your Project URL and Anon Key near the top.');
        }

        // Exchange the code/token in the URL for a session
        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (data.session) {
          await redirectAfterConfirm();
        } else {
          const params = new URLSearchParams(window.location.search);
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const code = params.get('code');
          const accessToken = hashParams.get('access_token');

          if (code) {
            const { error: exchangeError } = await supabase.auth.exchangeCodeForSession(code);
            if (exchangeError) throw exchangeError;
            await redirectAfterConfirm();
          } else if (accessToken) {
            await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: hashParams.get('refresh_token')
            });
            await redirectAfterConfirm();
          } else {
            throw new Error('No confirmation code found. The link may have expired.');
          }
        }
      } catch (err) {
        document.getElementById('icon').innerHTML = '⚠️';
        document.getElementById('icon').className = 'icon icon-error';
        document.getElementById('title').textContent = 'Something went wrong';
        document.getElementById('msg').textContent = err.message || 'The confirmation link may have expired. Please try signing up again.';
        document.getElementById('card').innerHTML += '<a href="signup.html" class="btn">Back to sign up</a>';
      }
    }

    async function redirectAfterConfirm() {
      document.getElementById('icon').innerHTML = '✅';
      document.getElementById('icon').className = 'icon icon-success';
      document.getElementById('title').textContent = 'Email confirmed!';

      try {
        const { data } = await supabase.auth.getUser();
        const meta = data?.user?.user_metadata || {};
        const onboardingComplete = meta.onboarding_complete;
        const isNewUser = !meta.business_name && !meta.trade_type;

        if (!onboardingComplete || isNewUser) {
          // New user — set trial start and send to onboarding
          if (!meta.trial_start) {
            await supabase.auth.updateUser({
              data: { trial_start: new Date().toISOString() }
            });
          }
          document.getElementById('msg').textContent = "Let's get your account set up...";
          setTimeout(() => { window.location.replace('welcome.html'); }, 1200);
        } else {
          // Returning user confirming email change
          document.getElementById('msg').textContent = 'Taking you to your dashboard...';
          setTimeout(() => { window.location.replace('dashboard.html'); }, 1200);
        }
      } catch(e) {
        // Fallback — if we can't read metadata just go to welcome
        document.getElementById('msg').textContent = "Let's get your account set up...";
        setTimeout(() => { window.location.replace('welcome.html'); }, 1200);
      }
    }

    handleCallback();
  </script>
</body>
</html>
