<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirming your account — Primo Invoice</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = 'YOUR_PROJECT_URL_HERE';
    var SUPABASE_KEY = 'YOUR_ANON_KEY_HERE';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #061A30 0%, #0A2540 55%, #0D3060 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 20px; padding: 44px 36px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
    .icon { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px; }
    .icon-spin { background: #EEF3F8; animation: spin 1s linear infinite; }
    .icon-success { background: #E1F5EE; }
    .icon-error { background: #FDEDED; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    h2 { font-size: 20px; font-weight: 700; color: #061A30; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B6A65; line-height: 1.6; }
    .btn { display: inline-block; margin-top: 20px; padding: 12px 28px; background: #0A2540; color: #fff; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .spinner { width: 36px; height: 36px; border: 3px solid #E5E3DC; border-top-color: #0A2540; border-radius: 50%; animation: spin 0.8s linear infinite; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon icon-spin" id="icon"><div class="spinner"></div></div>
    <h2 id="title">Confirming your account…</h2>
    <p id="msg">Please wait while we verify your email.</p>
  </div>

  <script>
    async function handleCallback() {
      try {
        var params     = new URLSearchParams(window.location.search);
        var hashParams = new URLSearchParams(window.location.hash.substring(1));
        var code        = params.get('code');
        var accessToken = hashParams.get('access_token');
        var refreshToken = hashParams.get('refresh_token');

        if (code) {
          var res = await supabase.auth.exchangeCodeForSession(code);
          if (res.error) throw res.error;
        } else if (accessToken) {
          var res = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
          if (res.error) throw res.error;
        } else {
          // Maybe already have a session
          var { data: sessData } = await supabase.auth.getSession();
          if (!sessData || !sessData.session) throw new Error('No confirmation code found. The link may have expired — please try signing in.');
        }

        await redirectAfterConfirm();

      } catch(err) {
        document.getElementById('icon').innerHTML = '⚠️';
        document.getElementById('icon').className = 'icon icon-error';
        document.getElementById('title').textContent = 'Something went wrong';
        document.getElementById('msg').textContent = err.message || 'The confirmation link may have expired. Please try signing in.';
        document.getElementById('card').innerHTML += '<a href="login.html" class="btn">Go to sign in</a>';
      }
    }

    async function redirectAfterConfirm() {
      document.getElementById('icon').innerHTML = '✅';
      document.getElementById('icon').className = 'icon icon-success';
      document.getElementById('title').textContent = 'Email confirmed!';

      try {
        var { data } = await supabase.auth.getUser();
        var meta = (data && data.user) ? (data.user.user_metadata || {}) : {};
        var isNewUser = !meta.onboarding_complete && !meta.business_name;

        if (isNewUser) {
          if (!meta.trial_start) {
            await supabase.auth.updateUser({ data: { trial_start: new Date().toISOString() } });
          }
          document.getElementById('msg').textContent = "Let's get your account set up…";
          setTimeout(function(){ window.location.replace('welcome.html'); }, 1000);
        } else {
          document.getElementById('msg').textContent = 'Taking you to your dashboard…';
          setTimeout(function(){ window.location.replace('dashboard.html'); }, 1000);
        }
      } catch(e) {
        document.getElementById('msg').textContent = "Let's get your account set up…";
        setTimeout(function(){ window.location.replace('welcome.html'); }, 1000);
      }
    }

    handleCallback();
  </script>
</body>
</html>
