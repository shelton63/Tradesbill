  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhranFjb2p1ZnF5cGJwc2VybHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDcxNzQsImV4cCI6MjA5ODA4MzE3NH0.39yk25pGqGbH_mcMCuVpfbKLj00KdPeHOArQKU9uPrE';

  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; overflow-x: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #061A30 0%, #0A2540 55%, #0D3060 100%);
      display: flex; flex-direction: column; }
    .nav { padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
    .nav-logo { font-size: 17px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-logo i { color: #5DCAA5; }
    .nav-step { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; }
    .progress-wrap { padding: 4px 40px 20px; position: relative; z-index: 1; }
    .progress-steps { display: flex; align-items: center; max-width: 440px; margin: 0 auto; }
    .p-step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .p-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .p-dot.done { background: #5DCAA5; color: #061A30; }
    .p-dot.active { background: #fff; color: #0A2540; }
    .p-dot.pending { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); border: 1.5px solid rgba(255,255,255,0.2); }
    .p-lbl { font-size: 10px; font-weight: 600; }
    .p-lbl.done { color: #5DCAA5; } .p-lbl.active { color: #fff; } .p-lbl.pending { color: rgba(255,255,255,0.35); }
    .p-line { flex: 1; height: 2px; margin-bottom: 18px; }
    .p-line.done { background: #5DCAA5; } .p-line.pending { background: rgba(255,255,255,0.15); }
    .page { flex: 1; display: flex; justify-content: center; padding: 0 20px 32px; position: relative; z-index: 1; }
    .card { background: #fff; border-radius: 20px; width: 100%; max-width: 540px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
    .card-header { background: linear-gradient(135deg, #061A30, #0A2540); padding: 22px 28px; display: flex; align-items: center; gap: 14px; }
    .hdr-icon { width: 42px; height: 42px; border-radius: 11px; background: rgba(93,202,165,0.2); display: flex; align-items: center; justify-content: center; }
    .hdr-icon i { font-size: 21px; color: #5DCAA5; }
    .hdr-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .hdr-sub { font-size: 12px; color: rgba(255,255,255,0.6); }
    .card-body { padding: 26px 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: #8B8A84; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field select { width: 100%; padding: 11px 14px; border: 1.5px solid #E5E3DC; border-radius: 10px; font-size: 14px; color: #1A1A18; font-family: inherit; outline: none; }
    .field input:focus, .field select:focus { border-color: #0A2540; box-shadow: 0 0 0 3px rgba(10,37,64,0.08); }
    /* Contact tabs */
    .contact-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    .contact-tab { flex: 1; padding: 9px; border-radius: 9px; font-size: 13px; font-weight: 600; border: 1.5px solid #E5E3DC; background: #fff; color: #6B6A65; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; }
    .contact-tab.active-email { border-color: #0A2540; background: #EEF3F8; color: #0A2540; }
    .contact-tab.active-wa { border-color: #25D366; background: #F0FEF4; color: #1A5C2E; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
    .input-icon-wrap input { padding-left: 38px; }
    .amount-wrap { position: relative; }
    .amount-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #6B6A65; font-weight: 600; }
    .amount-wrap input { padding-left: 28px; font-size: 18px; font-weight: 600; }
    .total-row { background: #F4F7FB; border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    .total-line { display: flex; justify-content: space-between; font-size: 13px; color: #6B6A65; margin-bottom: 5px; }
    .total-final { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; color: #061A30; border-top: 1px solid #E5E3DC; padding-top: 8px; margin-top: 5px; }
    .card-footer { padding: 18px 28px; border-top: 1px solid #F0EFEA; display: flex; align-items: center; justify-content: space-between; }
    .btn-back { background: none; border: none; color: #A3A29C; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
    .btn-next { background: #5DCAA5; color: #061A30; font-size: 14px; font-weight: 700; border: none; padding: 12px 26px; border-radius: 10px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 7px; }
    .btn-next:hover { background: #4DB894; }
    .btn-skip { background: none; border: none; color: #A3A29C; font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: underline; }
    .footer { padding: 14px; text-align: center; }
    .footer p { font-size: 12px; color: rgba(255,255,255,0.3); }
    @media (max-width: 560px) { .nav { padding: 14px 16px; } .progress-wrap { padding: 4px 16px 16px; } .card-body { padding: 20px; } .card-footer { padding: 16px 20px; flex-wrap: wrap; gap: 8px; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo"><i class="ti ti-file-invoice"></i> Primo Invoice</a>
    <div class="nav-step">Step 3 of 4</div>
  </nav>
  <div class="progress-wrap">
    <div class="progress-steps">
      <div class="p-step"><div class="p-dot done"><i class="ti ti-check" style="font-size:13px"></i></div><div class="p-lbl done">Business</div></div>
      <div class="p-line done"></div>
      <div class="p-step"><div class="p-dot done"><i class="ti ti-check" style="font-size:13px"></i></div><div class="p-lbl done">Payments</div></div>
      <div class="p-line done"></div>
      <div class="p-step"><div class="p-dot active">3</div><div class="p-lbl active">Invoice</div></div>
      <div class="p-line pending"></div>
      <div class="p-step"><div class="p-dot pending">4</div><div class="p-lbl pending">Send</div></div>
    </div>
  </div>
  <div class="page">
    <div class="card">
      <div class="card-header">
        <div class="hdr-icon"><i class="ti ti-file-plus"></i></div>
        <div><div class="hdr-title">Create your first invoice</div><div class="hdr-sub">Takes less than 60 seconds</div></div>
      </div>
      <div class="card-body">
        <div class="field"><label>Customer name <span style="color:#D14343">*</span></label><input type="text" id="cust-name" placeholder="e.g. Mark Taylor" autocomplete="off" /></div>

        <!-- Contact method tabs -->
        <div class="field">
          <label>Send invoice via</label>
          <div class="contact-tabs">
            <button type="button" id="tab-email" class="contact-tab active-email" onclick="switchTab('email')">
              <i class="ti ti-mail" style="font-size:15px"></i> Email
            </button>
            <button type="button" id="tab-wa" class="contact-tab" onclick="switchTab('whatsapp')">
              <i class="ti ti-brand-whatsapp" style="font-size:15px;color:#25D366"></i> WhatsApp
            </button>
          </div>
          <div id="email-wrap">
            <div class="input-icon-wrap">
              <i class="ti ti-mail" style="color:#A3A29C"></i>
              <input type="email" id="cust-email" placeholder="customer@email.com" autocomplete="off" />
            </div>
          </div>
          <div id="wa-wrap" style="display:none">
            <div class="input-icon-wrap">
              <i class="ti ti-brand-whatsapp" style="color:#25D366"></i>
              <input type="tel" id="cust-phone" placeholder="07700 900123" autocomplete="off" />
            </div>
            <div style="font-size:12px;color:#1A5C2E;margin-top:5px"><i class="ti ti-info-circle" style="font-size:12px"></i> We'll create a payment link you paste straight into WhatsApp</div>
          </div>
        </div>

        <div class="field"><label>Job description <span style="color:#D14343">*</span></label><input type="text" id="job-desc" placeholder="e.g. Bathroom refit at 14 Elm St" autocomplete="off" /></div>
        <div class="field">
          <label>Amount <span style="color:#D14343">*</span></label>
          <div class="amount-wrap"><span>£</span><input type="number" id="amount" placeholder="0.00" min="0" step="0.01" oninput="calcTotal()" /></div>
        </div>
        <div class="field">
          <label>VAT</label>
          <select id="vat" onchange="calcTotal()">
            <option value="0">No VAT (0%)</option>
            <option value="5">5% VAT</option>
            <option value="20">20% VAT</option>
          </select>
        </div>
        <div id="total-row" class="total-row" style="display:none">
          <div class="total-line"><span>Subtotal</span><span id="sub-display">£0.00</span></div>
          <div class="total-line" id="vat-line" style="display:none"><span id="vat-label">VAT (20%)</span><span id="vat-display">£0.00</span></div>
          <div class="total-final"><span>Total due</span><span id="total-display">£0.00</span></div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-back" onclick="window.location.href='onboarding-payments.html'"><i class="ti ti-arrow-left" style="font-size:14px"></i> Back</button>
        <div style="display:flex;align-items:center;gap:14px">
          <button class="btn-skip" onclick="skipInvoice()">Skip for now</button>
          <button class="btn-next" onclick="continueNext()">Continue <i class="ti ti-arrow-right" style="font-size:14px"></i></button>
        </div>
      </div>
    </div>
  </div>
  <div class="footer"><p>© 2026 Primo Invoice · Payments powered by Stripe</p></div>
  <script>
    var contactMode = 'email';

    function switchTab(mode) {
      contactMode = mode;
      var tabEmail = document.getElementById('tab-email');
      var tabWa    = document.getElementById('tab-wa');
      var emailWrap = document.getElementById('email-wrap');
      var waWrap    = document.getElementById('wa-wrap');
      if (mode === 'email') {
        tabEmail.className = 'contact-tab active-email';
        tabWa.className    = 'contact-tab';
        emailWrap.style.display = 'block';
        waWrap.style.display = 'none';
      } else {
        tabEmail.className = 'contact-tab';
        tabWa.className    = 'contact-tab active-wa';
        emailWrap.style.display = 'none';
        waWrap.style.display = 'block';
        document.getElementById('cust-phone').focus();
      }
    }

    function calcTotal() {
      var amt = parseFloat(document.getElementById('amount').value) || 0;
      var vat = parseInt(document.getElementById('vat').value) || 0;
      var vatAmt = amt * vat / 100;
      var total = amt + vatAmt;
      var row = document.getElementById('total-row');
      if (amt > 0) {
        row.style.display = 'block';
        document.getElementById('sub-display').textContent = '£' + amt.toFixed(2);
        var vatLine = document.getElementById('vat-line');
        if (vat > 0) {
          vatLine.style.display = 'flex';
          document.getElementById('vat-label').textContent = 'VAT (' + vat + '%)';
          document.getElementById('vat-display').textContent = '£' + vatAmt.toFixed(2);
        } else { vatLine.style.display = 'none'; }
        document.getElementById('total-display').textContent = '£' + total.toFixed(2);
      } else { row.style.display = 'none'; }
    }

    function continueNext() {
      var name  = document.getElementById('cust-name').value.trim();
      var job   = document.getElementById('job-desc').value.trim();
      var amt   = parseFloat(document.getElementById('amount').value) || 0;
      var email = document.getElementById('cust-email').value.trim();
      var phone = document.getElementById('cust-phone').value.trim();
      if (!name) { alert('Please enter a customer name.'); return; }
      if (!job)  { alert('Please enter a job description.'); return; }
      if (amt <= 0) { alert('Please enter an amount.'); return; }
      var vat    = parseInt(document.getElementById('vat').value) || 0;
      var vatAmt = amt * vat / 100;
      var total  = amt + vatAmt;
      sessionStorage.setItem('ob_invoice', JSON.stringify({
        customer: name, email: email, phone: phone,
        job: job, amount: amt, vat: vat, total: total,
        contactMode: contactMode
      }));
      window.location.href = 'onboarding-send.html';
    }

    async function skipInvoice() {
      try { await supabase.auth.updateUser({ data: { onboarding_complete: true, trial_start: new Date().toISOString() } }); } catch(e) {}
      window.location.href = 'dashboard.html';
    }

    async function loadUser() {
      try {
        var { data } = await supabase.auth.getUser();
        if (!data || !data.user) { window.location.href = 'login.html'; }
      } catch(e) {}
    }
    loadUser();
  </script>
</body>
</html>
